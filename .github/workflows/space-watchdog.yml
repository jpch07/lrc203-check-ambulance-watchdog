name: LRC 203 Space Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_SPACE_ID: lrc203/check-ambulance
      LRC_APP_URL: https://lrc203-check-ambulance.hf.space
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      LRC_NOTIFY_EMAIL_TO: ${{ secrets.LRC_NOTIFY_EMAIL_TO }}
    steps:
      - name: Check and repair Space
        run: |
          python - <<'PY'
          import json
          import os
          import smtplib
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from email.message import EmailMessage

          space_id = os.environ["HF_SPACE_ID"]
          app_url = os.environ["LRC_APP_URL"].rstrip("/")
          token = os.environ["HF_TOKEN"]
          hf_api = "https://huggingface.co"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def read_text(url, timeout=30, method="GET"):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      return response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {exc.code} {url}: {body[:500]}") from exc

          def read_json(url, timeout=30, method="GET"):
              return json.loads(read_text(url, timeout=timeout, method=method))

          def runtime():
              return read_json(f"{hf_api}/api/spaces/{space_id}/runtime")

          def app_health():
              manifest = read_json(f"{app_url}/api/manifest", timeout=45)
              metadata = manifest.get("metadata") or {}
              return {
                  "title": metadata.get("title", ""),
                  "questions": metadata.get("questionCount", 0),
                  "target": (manifest.get("target") or {}).get("label", ""),
              }

          def restart_space():
              return read_json(f"{hf_api}/api/spaces/{space_id}/restart", timeout=45, method="POST")

          def send_email(subject, body):
              host = os.getenv("SMTP_HOST")
              user = os.getenv("SMTP_USER")
              password = os.getenv("SMTP_PASSWORD")
              sender = os.getenv("SMTP_FROM") or user
              recipient = os.getenv("LRC_NOTIFY_EMAIL_TO")
              if not host or not user or not password or not sender or not recipient:
                  print("Email skipped because SMTP configuration is incomplete.")
                  return
              message = EmailMessage()
              message["Subject"] = subject
              message["From"] = sender
              message["To"] = recipient
              message.set_content(body)
              with smtplib.SMTP(host, int(os.getenv("SMTP_PORT") or "587"), timeout=30) as smtp:
                  smtp.starttls()
                  smtp.login(user, password)
                  smtp.send_message(message)

          def snapshot(label, rt=None, health=None, error=""):
              rt = rt or {}
              return {
                  "label": label,
                  "time": now(),
                  "stage": rt.get("stage", ""),
                  "runtime_error": rt.get("errorMessage", ""),
                  "health": health or {},
                  "error": error,
              }

          def clean_error(text):
              compact = " ".join(str(text or "").split())
              if not compact:
                  return ""
              lowered = compact.lower()
              if "504 gateway timeout" in lowered:
                  return "Hugging Face returned 504 Gateway Timeout."
              if "read operation timed out" in lowered or "timed out" in lowered:
                  return "The request timed out."
              if len(compact) > 180:
                  return compact[:180] + "..."
              return compact

          def event_line(item):
              label = item.get("label", "")
              stage = item.get("stage") or "no stage"
              health = item.get("health") or {}
              error = clean_error(item.get("runtime_error") or item.get("error"))
              if label == "before":
                  if health.get("questions"):
                      return f"Initial check: app responded normally ({health.get('questions')} questions)."
                  return f"Initial check: app/runtime did not respond normally. {error}".strip()
              if label == "restart_requested":
                  return f"Restart: request sent to Hugging Face (stage: {stage})."
              if label == "restart_failed":
                  return f"Restart: Hugging Face did not accept the restart request. {error}".strip()
              if health.get("questions"):
                  return f"Recovery check: app responded normally ({health.get('questions')} questions, stage: {stage})."
              return f"Recovery check: still not healthy ({stage}). {error}".strip()

          def format_watchdog_email(recovered, snapshots):
              final = next((item for item in reversed(snapshots) if (item.get("health") or {}).get("questions")), {})
              final_health = final.get("health") or {}
              final_stage = final.get("stage") or ("RUNNING" if recovered else "unknown")
              restart_failed = any(item.get("label") == "restart_failed" for item in snapshots)
              restart_requested = any(item.get("label") == "restart_requested" for item in snapshots)

              subject = "LRC 203 app is online again" if recovered else "Action needed: LRC 203 app may be down"
              action = "No action needed." if recovered else "Open Hugging Face and restart the Space manually."
              meaning = (
                  "This looks like a temporary Hugging Face timeout. The ambulance check app is working now."
                  if recovered and restart_failed
                  else "The watchdog requested a restart and the app is working now."
                  if recovered and restart_requested
                  else "The watchdog could not confirm that the app recovered."
              )
              timeline = "\n".join(f"- {event_line(item)}" for item in snapshots[:8])
              technical = "\n".join(
                  "- "
                  + " | ".join(
                      part
                      for part in [
                          item.get("label", ""),
                          item.get("time", ""),
                          f"stage={item.get('stage') or 'unknown'}",
                          clean_error(item.get("runtime_error") or item.get("error")),
                      ]
                      if part
                  )
                  for item in snapshots
              )
              body = "\n\n".join(
                  [
                      "LRC 203 App Watchdog",
                      f"Status: {'ONLINE NOW' if recovered else 'MAY STILL BE DOWN'}",
                      f"Action needed: {action}",
                      f"App: {app_url}",
                      "What happened:\n" + timeline,
                      "Current check:\n"
                      + "\n".join(
                          [
                              f"- Space stage: {final_stage}",
                              f"- Form target: {final_health.get('target') or 'unknown'}",
                              f"- Questions detected: {final_health.get('questions') or 'unknown'}",
                          ]
                      ),
                      "Meaning:\n" + meaning,
                      "Technical details:\n" + technical,
                      f"Space: {space_id}",
                  ]
              )
              return subject, body

          snapshots = []
          try:
              before_rt = runtime()
              before_health = app_health() if before_rt.get("stage") == "RUNNING" else {}
              snapshots.append(snapshot("before", before_rt, before_health))
              healthy = before_rt.get("stage") == "RUNNING" and bool(before_health.get("questions"))
          except Exception as exc:
              healthy = False
              snapshots.append(snapshot("before", error=str(exc)))

          if healthy:
              print("Space healthy:", json.dumps(snapshots[-1], ensure_ascii=False))
              raise SystemExit(0)

          print("Space unhealthy; restarting.", json.dumps(snapshots[-1], ensure_ascii=False))
          try:
              restart_result = restart_space()
              snapshots.append(snapshot("restart_requested", restart_result))
          except Exception as exc:
              snapshots.append(snapshot("restart_failed", error=str(exc)))

          recovered = False
          for attempt in range(1, 25):
              time.sleep(10)
              try:
                  rt = runtime()
                  health = app_health() if rt.get("stage") == "RUNNING" else {}
                  snapshots.append(snapshot(f"after_{attempt}", rt, health))
                  if rt.get("stage") == "RUNNING" and health.get("questions"):
                      recovered = True
                      break
              except Exception as exc:
                  snapshots.append(snapshot(f"after_{attempt}", error=str(exc)))

          subject, body = format_watchdog_email(recovered, snapshots)
          send_email(subject, body)
          print(body)
          raise SystemExit(0 if recovered else 1)
          PY
      - name: Record monthly deployment health
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          endpoint = f"https://api.github.com/repos/{os.environ['GH_REPO']}/contents/health/monthly.json"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          now = datetime.now(timezone.utc)
          month = now.strftime("%Y-%m")
          previous = {}
          try:
              with urllib.request.urlopen(urllib.request.Request(endpoint, headers=headers), timeout=30) as response:
                  previous = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          if previous:
              record = json.loads(base64.b64decode(previous["content"]))
              if record.get("month") == month:
                  print("Monthly deployment health already recorded.")
                  raise SystemExit(0)
          try:
              with urllib.request.urlopen(os.environ["LRC_APP_URL"] + "/api/manifest", timeout=45) as response:
                  manifest = json.load(response)
              health = {"reachable": True, "questions": manifest.get("metadata", {}).get("questionCount", 0)}
          except Exception as error:
              health = {"reachable": False, "error_type": type(error).__name__}
          record = {"month": month, "checked_at": now.isoformat(), "health": health}
          payload = {
              "message": f"Record deployment health for {month}",
              "content": base64.b64encode((json.dumps(record, indent=2) + "\n").encode()).decode(),
          }
          if previous:
              payload["sha"] = previous["sha"]
          request = urllib.request.Request(endpoint, headers=headers, data=json.dumps(payload).encode(), method="PUT")
          with urllib.request.urlopen(request, timeout=30) as response:
              print("Monthly deployment health recorded:", response.status)
          PY

